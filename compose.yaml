name: nss-blood-donor-local
services:
  database:
    image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
    environment:
      POSTGRES_USER: nss_local
      POSTGRES_PASSWORD: synthetic_local_only
      POSTGRES_DB: nss_local
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nss_local -d nss_local']
      interval: 2s
      timeout: 5s
      retries: 30
    restart: 'no'
volumes:
  database:
